<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a2e">
<title>日本駅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;800&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<!-- タイトル -->
<section id="title" class="screen active">
  <div class="sign-board">
    <div class="sign-top">にほんえき</div>
    <h1>日本駅</h1>
    <div class="sign-sub">NIHON STATION</div>
    <div class="sign-line"><span>◀ 前の駅 はじまり</span><span>次の駅 どこまでも ▶</span></div>
  </div>
  <button id="btnStart" class="big-btn">スタート</button>
  <div class="ticket-hint">PC: ↑↓ / W S でノッチ ・ スマホ: 画面のレバー</div>
</section>

<!-- ロード -->
<section id="loading" class="screen">
  <div class="load-box">
    <div class="load-train">🚃</div>
    <div class="load-text" id="loadText">発車準備中…</div>
    <div class="load-bar"><div id="loadFill"></div></div>
    <div class="load-tip" id="loadTip"></div>
  </div>
</section>

<!-- メニュー -->
<section id="menu" class="screen">
  <header class="topbar">
    <div class="station-name">日本駅 <small>ホーム</small></div>
    <div class="coin-pill">🪙 <span class="coinVal">0</span></div>
  </header>
  <div class="menu-current" id="menuCurrent"></div>
  <div class="menu-grid">
    <button class="menu-btn run" data-go="drive"><span class="ic">🚄</span>走行<small>出発進行！</small></button>
    <button class="menu-btn" data-go="shop"><span class="ic">🛒</span>ショップ<small>電車を買う</small></button>
    <button class="menu-btn" data-go="upgrade"><span class="ic">🔧</span>アップグレード<small>性能を強化</small></button>
  </div>
  <button class="menu-tut" data-go="tutorial" id="btnTut">🔰 チュートリアル<small>はじめての人はここから</small></button>
  <div class="menu-best">最長走行記録: <b id="bestDist">0</b> m<span id="bestStation"></span></div>
  <button class="link-btn" id="btnBackTitle">タイトルへ</button>
</section>

<!-- ショップ -->
<section id="shop" class="screen">
  <header class="topbar">
    <button class="back-btn" data-go="menu">◀ 戻る</button>
    <div class="station-name">ショップ</div>
    <div class="coin-pill">🪙 <span class="coinVal">0</span></div>
  </header>
  <div class="card-list" id="shopList"></div>
</section>

<!-- アップグレード -->
<section id="upgrade" class="screen">
  <header class="topbar">
    <button class="back-btn" data-go="menu">◀ 戻る</button>
    <div class="station-name">アップグレード</div>
    <div class="coin-pill">🪙 <span class="coinVal">0</span></div>
  </header>
  <div class="card-list" id="upList"></div>
</section>

<!-- 走行HUD -->
<section id="hud" class="screen hud">
  <div class="hud-top">
    <div class="hud-box"><label>距離</label><b id="hDist">0</b><i>m</i></div>
    <div class="hud-box"><label>コイン</label><b id="hCoin">0</b></div>
    <div class="hud-box next"><label id="hNextLabel">次</label><b id="hNext">-</b></div>
    <button class="hud-small" id="btnCam">📷</button>
    <button class="hud-small" id="btnPause">⏸</button>
  </div>
  <div class="hud-warn" id="hWarn"></div>
  <div class="hud-msg" id="hMsg"></div>
  <div class="station-board" id="stationBoard">
    <div class="sb-name" id="sbName"></div>
    <div class="sb-kana" id="sbKana"></div>
    <div class="sb-line"><span id="sbPrev"></span><span id="sbNext"></span></div>
  </div>
  <div class="meter">
    <div class="speed"><b id="hSpeed">0</b><i>km/h</i></div>
    <div class="limit" id="hLimit">制限 --</div>
    <div class="gauge"><div id="hGauge"></div><div id="hGaugeLimit"></div></div>
  </div>
  <div class="lever">
    <button id="btnUp" class="lv-btn">▲<small>力行</small></button>
    <div class="notch" id="hNotch">N</div>
    <div class="notch-scale" id="notchScale"></div>
    <button id="btnDown" class="lv-btn brake">▼<small>ブレーキ</small></button>
    <button id="btnEB" class="lv-btn eb">非常</button>
  </div>
  <button id="btnHorn" class="horn">📯</button>
  <div class="tut-box" id="tutBox">
    <div class="tut-head"><span>🔰 チュートリアル</span><span id="tutStep"></span></div>
    <div class="tut-text" id="tutText"></div>
    <div class="tut-btns">
      <button id="tutSkip" class="tut-skip">やめる</button>
      <button id="tutNext" class="tut-next">次へ ▶</button>
    </div>
  </div>
</section>

<!-- ポーズ -->
<section id="pause" class="screen overlay">
  <div class="panel">
    <h2>一時停止</h2>
    <button class="big-btn" id="btnResume">再開</button>
    <button class="big-btn gray" id="btnQuit">運転終了</button>
  </div>
</section>

<!-- リザルト -->
<section id="result" class="screen overlay">
  <div class="panel">
    <h2 id="rTitle">脱線！</h2>
    <div class="r-reason" id="rReason"></div>
    <div class="r-row"><span>走行距離</span><b id="rDist">0 m</b></div>
    <div class="r-row"><span>到達駅</span><b id="rStation">-</b></div>
    <div class="r-row"><span>停車ボーナス</span><b id="rBonus">0</b></div>
    <div class="r-row"><span>コイン倍率</span><b id="rMul">x1.0</b></div>
    <div class="r-row total"><span>獲得コイン</span><b id="rCoin">0</b></div>
    <div class="r-best" id="rBest"></div>
    <button class="big-btn" id="btnRetry">もう一度</button>
    <button class="big-btn gray" id="btnToMenu">メニューへ</button>
  </div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
